[project]
name = "leitura-medidor"
version = "0.1.0"
description = "Serviço BentoML de extração de leitura de medidor de energia"
requires-python = "==3.12.*"
dependencies = [
    "bentoml==1.4.39",
    "httpx==0.28.1",
    "pillow==12.3.0",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "rust-just==1.58.0",
    "starlette==1.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Avisos de descontinuação vêm de dentro das bibliotecas (BentoML, pydantic), não do nosso código.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
